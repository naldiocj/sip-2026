version: "3.9"

services:
  # ─── BACKEND ───
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sip-backend
    env_file: ../backend/.env.docker
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - backend_deps:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sip
    restart: unless-stopped

  # ─── FRONTEND ───
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: deps
    container_name: sip-frontend
    environment:
      - BACKEND_URL=http://nginx:80
      - NEXT_PUBLIC_API_URL=
    ports:
      - "3000:3000"
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - ../frontend/next.config.ts:/app/next.config.ts
      - ../frontend/tsconfig.json:/app/tsconfig.json
      - ../frontend/vitest.config.ts:/app/vitest.config.ts
      - ../frontend/components.json:/app/components.json
      - frontend_deps:/app/node_modules
    command: sh -c "npm run dev"
    depends_on:
      - nginx
    networks:
      - sip
    restart: unless-stopped

  # ─── NGINX ───
  nginx:
    image: nginx:alpine
    container_name: sip-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - sip
    restart: unless-stopped

  # ─── POSTGRESQL ───
  postgres:
    image: postgres:16-alpine
    container_name: sip-postgres
    environment:
      POSTGRES_USER: sip
      POSTGRES_PASSWORD: sip
      POSTGRES_DB: sip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sip -d sip"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sip
    restart: unless-stopped

  # ─── REDIS ───
  redis:
    image: redis:7-alpine
    container_name: sip-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sip
    restart: unless-stopped

  # ─── RABBITMQ ───
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sip-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: sip
      RABBITMQ_DEFAULT_PASS: sip
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - sip
    restart: unless-stopped

  # ─── MINIO ───
  minio:
    image: minio/minio
    container_name: sip-minio
    environment:
      MINIO_ROOT_USER: sip
      MINIO_ROOT_PASSWORD: sip-secret
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - sip
    restart: unless-stopped

  # ─── OPENSEARCH ───
  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: sip-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Admin@123
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - sip
    restart: unless-stopped

  # ─── PROMETHEUS ───
  prometheus:
    image: prom/prometheus:latest
    container_name: sip-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - sip
    restart: unless-stopped

  # ─── GRAFANA ───
  grafana:
    image: grafana/grafana:latest
    container_name: sip-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - sip
    restart: unless-stopped

# ─── NETWORKS ───
networks:
  sip:
    driver: bridge

# ─── VOLUMES ───
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  opensearch_data:
  prometheus_data:
  grafana_data:
  backend_deps:
  frontend_deps:
